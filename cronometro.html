<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORFEU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAINEL DE FOCO -->
    <div id="painel-foco" class="container-principal">
        <header class="cabecalho">
            <h1>ORFEU</h1>
            <p>Gerenciador de Foco e Recuperação</p>
        </header>

        <div class="card card-cronometro">
            <input type="text" id="materia" class="input-materia" placeholder="Digite a matéria (ex: PYTHON, ADS)">
            <h2 id="visor" class="visor-digital">00:00:00.00</h2>
            
            <div class="controles">
                <button id="btn-iniciar" class="btn btn-primario">Iniciar</button>
                <button id="btn-pausar" class="btn btn-secundario">Pausar</button>
                <button id="btn-concluir" class="btn btn-concluir">Concluir</button>
            </div>
        </div>

        <div class="grade-dados">
            <div class="card">
                <h3>Histórico de Sessões</h3>
                <ul id="historico" class="lista-dados"></ul>
            </div>
            
            <div class="card">
                <h3>Acumulado por Matéria</h3>
                <ul id="placar" class="lista-dados"></ul>
            </div>
        </div>
    </div>
   
    <!-- PAINEL DE DESCANSO -->
    <div id="painel-descanso" class="container-principal escondido" style="text-align: center;">
        <h2 style="margin-bottom: 30px; color: #1a252f;">Descanso Merecido</h2>
        
        <div class="relogio-container">
            <svg class="anel-progresso" width="200" height="200">
                <circle class="anel-fundo" cx="100" cy="100" r="90"></circle>
                <circle class="anel-animado" cx="100" cy="100" r="90"></circle>
            </svg>
            <h1 id="visor-descanso" class="visor-dentro-do-anel">00:00:00</h1>
        </div>

        <button id="btnPularDescanso" class="btn btn-secundario" style="margin-top: 30px;">Pular Descanso</button>
    </div>

    <!-- O motor lógico continua intacto -->
    <script src="script.js"></script>
</body>
</html>
